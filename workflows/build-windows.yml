name: Compiler Cinétoile pour Windows

# Se déclenche manuellement depuis l'onglet "Actions" du repo GitHub
# (bouton "Run workflow"), ou automatiquement à chaque envoi sur main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installer les dépendances du projet
        run: npm install

      - name: Générer les icônes
        run: npx tauri icon app-icon-source.png

      - name: Compiler l'application Windows
        run: npx tauri build

      - name: Mettre le résultat à disposition (téléchargeable depuis l'onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: cinetoile-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
