name: Compiler et publier Cinétoile (Mac + Windows)

# Se déclenche automatiquement à chaque mise à jour du dépôt (par exemple,
# quand dist/index.html change), ou manuellement via l'onglet Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Lit le numéro de version directement dans le code du jeu, pour ne
  # jamais avoir à le retaper à la main.
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: extract
        run: |
          VERSION=$(grep -oP "const APP_VERSION = '\K[^']+" dist/index.html)
          echo "Version detectee : $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-mac:
    needs: get-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri icon app-icon-source.png
      - run: npx tauri build
      - run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/dmg/*.dmg out/Cinetoile-Mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: out/Cinetoile-Mac.dmg

  build-windows:
    needs: get-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri icon app-icon-source.png
      - run: npx tauri build
      - shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/Cinetoile-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: out/Cinetoile-Windows.exe

  # Récupère les deux fichiers compilés et publie une seule Release avec
  # les deux dedans, sur le repo "Mac" (celui que le bouton du jeu utilise).
  publish-release:
    needs: [get-version, build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-files
      - uses: softprops/action-gh-release@v2
        with:
          repository: LaBobine549/Mac
          tag_name: v${{ needs.get-version.outputs.version }}
          name: Cinétoile ${{ needs.get-version.outputs.version }}
          files: release-files/*
          token: ${{ secrets.MAC_REPO_TOKEN }}
